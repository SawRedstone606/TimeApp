name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System & Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev \
          python3-dev python3-pip zip unzip openjdk-17-jdk \
          ccache git libncurses5:i386 libstdc++6:i386 zlib1g:i386

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Accept Android SDK Licenses Automatically
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # กดยอมรับ License ของ SDK ทั้งหมดล่วงหน้า
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TimeApp-APK
        path: bin/*.apk
